[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-lora-finetune-demo"
version = "0.1.0"
description = "OSS learning: CPU-friendly toy LoRA adapters on a tiny numpy model + before/after eval harness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "vk-ai" }]
keywords = ["lora", "fine-tune", "numpy", "eval", "pytest", "learning"]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tiny-lora = "tiny_lora.__main__:main"

[project.urls]
Homepage = "https://github.com/vk-ai/tiny-lora-finetune-demo"
Issues = "https://github.com/vk-ai/tiny-lora-finetune-demo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_lora"]

[tool.hatch.build.targets.wheel.sources]
"src/tiny_lora" = "tiny_lora"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
