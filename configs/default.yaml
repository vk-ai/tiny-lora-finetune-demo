# Tiny LoRA fine-tune demo config (CPU / learning only)
seed: 42

data:
  n_train: 256
  n_test: 64
  n_features: 16
  n_classes: 3
  noise: 0.15

model:
  hidden_dim: 32
  # Base weights are frozen; only LoRA adapters train.

lora:
  rank: 4
  alpha: 8.0
  # classic = alpha / rank ; rslora = alpha / sqrt(rank)
  scaling: classic
  # Optional eval sweep (evals/runner.py --sweep): ranks: [2, 4, 8]
  # DoRA: magnitude vector + normalized direction (peft use_dora=True analogue)
  use_dora: false
  # Optional QLoRA *concept*: fake-4bit frozen base (bnb skipped if absent)
  qlora: false

train:
  epochs: 50
  lr: 0.1
  batch_size: 32
  l2: 1.0e-4

eval:
  report_before_after: true
  # Fold LoRA into W and score merged vs adapter (assign-return / peft#2032 lesson)
  merge_and_unload: true
